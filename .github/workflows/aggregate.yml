name: aggregate

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-configs:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.list.outputs.configs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          {
            echo -n 'configs='
            find configs/search -maxdepth 1 \( -name '*.yaml' -o -name '*.yml' \) \
              ! -name 'shared-forbidden-strings.yaml' \
              ! -name 'linkedin.yaml' \
              ! -name 'linkedin-remote.yaml' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          } >> "$GITHUB_OUTPUT"

  run:
    needs: list-configs
    if: needs.list-configs.outputs.configs != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        conf: ${{ fromJSON(needs.list-configs.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pipeline
        env:
          ENVLOCAL: ${{ secrets.ENVLOCAL }}
        run: |
          set -a
          printf '%s\n' "$ENVLOCAL" > .env.local
          source .env.local
          set +a
          npx tsx src/cli/run.ts --conf ${{ matrix.conf }}
      - id: error-log
        if: always()
        env:
          CONF: ${{ matrix.conf }}
        run: |
          if [ -s errors.log ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          echo "artifact=errors-${CONF//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.error-log.outputs.present == 'true'
        with:
          name: ${{ steps.error-log.outputs.artifact }}
          path: errors.log
          if-no-files-found: ignore
      - id: review-artifact
        if: always()
        env:
          CONF: ${{ matrix.conf }}
        run: echo "name=review-${CONF//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.review-artifact.outputs.name }}
          path: review-created.json
          if-no-files-found: ignore

  review:
    needs: run
    if: always() && (needs.run.result == 'success' || needs.run.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: review-*
          path: review-created
      - name: Review new cards
        env:
          ENVLOCAL: ${{ secrets.ENVLOCAL }}
        run: |
          set -a
          printf '%s\n' "$ENVLOCAL" > .env.local
          source .env.local
          set +a
          npx tsx src/cli/review-created.ts review-created
      - id: error-log
        if: always()
        run: |
          if [ -s errors.log ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.error-log.outputs.present == 'true'
        with:
          name: errors-review
          path: errors.log
          if-no-files-found: ignore

  cleanup:
    needs: run
    if: always() && (needs.run.result == 'success' || needs.run.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Delete archived pages older than a month
        env:
          ENVLOCAL: ${{ secrets.ENVLOCAL }}
        run: |
          set -a
          printf '%s\n' "$ENVLOCAL" > .env.local
          source .env.local
          set +a
          npx tsx src/cli/cleanup-stale.ts
      - id: error-log
        if: always()
        run: |
          if [ -s errors.log ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.error-log.outputs.present == 'true'
        with:
          name: errors-cleanup
          path: errors.log
          if-no-files-found: ignore
