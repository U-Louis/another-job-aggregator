name: aggregate

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-configs:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.list.outputs.configs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          {
            echo -n 'configs='
            find configs -maxdepth 1 \( -name '*.yaml' -o -name '*.yml' \) | jq -R -s -c 'split("\n") | map(select(length > 0))'
          } >> "$GITHUB_OUTPUT"

  run:
    needs: list-configs
    if: needs.list-configs.outputs.configs != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        conf: ${{ fromJSON(needs.list-configs.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pipeline
        env:
          ENVLOCAL: ${{ secrets.ENVLOCAL }}
        run: |
          set -a
          printf '%s\n' "$ENVLOCAL" > .env.local
          source .env.local
          set +a
          npx tsx src/cli/run.ts --conf ${{ matrix.conf }}
      - id: error-log
        if: always()
        run: |
          if [ -s errors.log ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.error-log.outputs.present == 'true'
        with:
          name: errors-${{ matrix.conf }}
          path: errors.log
          if-no-files-found: ignore
