name: aggregate

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-configs:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.list.outputs.configs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          {
            echo -n 'configs='
            find configs -maxdepth 1 \( -name '*.yaml' -o -name '*.yml' \) | jq -R -s -c 'split("\n") | map(select(length > 0))'
          } >> "$GITHUB_OUTPUT"

  run:
    needs: list-configs
    if: needs.list-configs.outputs.configs != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        conf: ${{ fromJSON(needs.list-configs.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx src/cli/run.ts --conf ${{ matrix.conf }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
