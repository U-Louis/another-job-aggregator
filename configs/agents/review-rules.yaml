# Archive rules for newly created Notion cards.
# Fill `rules`. Each entry is one reason to set Status to "archived".
# `reason` is what the model matches against.
# `comment` is posted on the card verbatim when that rule matches.
# No matching rule leaves the card in the review queue.
# An empty list skips review.
#
# grok-4.7 through Cursor, effort medium, fast off.

model: grok-4.7
reasoning_effort: medium
rules:
  - id: field
    reason: if the job is NOT about tech, development, engineering, or IT THEN archive it
    comment: Archived — not tech.
  - id: zone
    reason: if the job is (NOT full remote) AND (NOT around Caen or Normandy) THEN archive it
    comment: Archived — not full remote and not around Caen or Normandy.
  - id: zone2
    reason: if the job is full remote but in US only or canada only or any country except France THEN archive it
    comment: Archived — not full remote for France.
  - id: zone3
    reason: if the job is full remote but in has any citizenship required for any country except France THEN archive it
    comment: Archived — not full remote for French citizens.
  - id: stack
    reason: if the job does NOT mention PHP, Laravel, Symfony, Vue, JavaScript, or TypeScript THEN archive it
    comment: Archived — not my stack.
